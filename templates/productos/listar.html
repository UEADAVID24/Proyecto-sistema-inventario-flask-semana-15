{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">
    <h2>Lista de Productos</h2>

    <a href="{{ url_for('agregar_producto') }}" class="btn btn-primary mb-3">Agregar Producto</a>
    <a href="{{ url_for('reporte') }}" class="btn btn-success mb-3">Descargar PDF</a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Cantidad</th>
                <th>Precio</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for p in productos %}
            <tr>
                <td>{{ p[0] }}</td>
                <td>{{ p[1] }}</td>
                <td>{{ p[2] }}</td>
                <td>${{ p[3] }}</td>
                <td>
                    <a href="{{ url_for('editar_producto', id=p[0]) }}" class="btn btn-warning btn-sm">Editar</a>

                    <!-- 🔥 CORREGIDO AQUÍ -->
                    <a href="{{ url_for('eliminar_producto_route', id=p[0]) }}" 
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('¿Seguro que deseas eliminar?')">
                       Eliminar
                    </a>

                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
