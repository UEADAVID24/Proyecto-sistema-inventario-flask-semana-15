{% extends 'base.html' %}

{% block title %}Factura{% endblock %}

{% block content %}

<h2 style="text-align:center; margin-bottom:20px;">🧾 Lista de Facturas</h2>

<div style="display:flex; justify-content:center;">
    <div style="
        width:80%;
        background:white;
        padding:20px;
        border-radius:12px;
        box-shadow:0px 4px 12px rgba(0,0,0,0.2);
    ">

        <table style="
            width:100%;
            border-collapse: collapse;
            text-align:center;
        ">

            <thead>
                <tr style="background:#343a40; color:white;">
                    <th style="padding:12px;">ID</th>
                    <th>Cliente</th>
                    <th>Fecha</th>
                    <th>Total</th>
                </tr>
            </thead>

            <tbody>
                {% for f in datos %}
                <tr style="border-bottom:1px solid #ddd;">
                    <td style="padding:12px;">{{ f[0] }}</td>
                    <td>{{ f[1] }}</td>
                    <td>{{ f[2] }}</td>
                    <td>${{ f[3] }}</td>
                </tr>
                {% endfor %}
            </tbody>

        </table>

    </div>
</div>

{% endblock %}
