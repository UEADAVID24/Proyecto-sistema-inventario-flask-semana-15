{% extends 'base.html' %}

{% block title %}Ventas{% endblock %}

{% block content %}

<div class="container mt-4">
    <h2 class="text-center mb-4">📊 Lista de Ventas</h2>

    <div class="table-responsive">
        <table class="table table-striped table-hover text-center align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Fecha</th>
                    <th>Cliente</th>
                    <th>Precio</th>
                </tr>
            </thead>

            <tbody>
                {% for v in ventas %}
                <tr>
                    <td>{{ v[0] }}</td>
                    <td>{{ v[1] }}</td>
                    <td>{{ v[2] }}</td>
                    <td>{{ v[3] }}</td>
                    <td>{{ v[4] }}</td>
                    <td>{{ v[5] }}</td>
                    <td><strong>${{ v[6] }}</strong></td>
                </tr>
                {% endfor %}
            </tbody>

        </table>
    </div>
</div>

{% endblock %}
