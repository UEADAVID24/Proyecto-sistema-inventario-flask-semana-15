{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <h2 class="mb-4">👋 Bienvenido Clinton</h2>

    <!-- TARJETAS -->
    <div class="row text-center">

        <!-- PRODUCTOS -->
        <div class="col-md-4 mb-4">
            <div class="card text-white shadow" style="background-color:#1e66dc; border-radius:12px;">
                <div class="card-body p-4">
                    <h4>📦 Productos</h4>
                    <p>Gestiona tu inventario</p>
                    <a href="/productos" class="btn btn-light">Ver Productos</a>
                </div>
            </div>
        </div>

        <!-- CLIENTES -->
        <div class="col-md-4 mb-4">
            <div class="card text-white shadow" style="background-color:#198754; border-radius:12px;">
                <div class="card-body p-4">
                    <h4>👥 Clientes</h4>
                    <p>Administrar clientes</p>
                    <a href="/clientes" class="btn btn-light">Ver Clientes</a>
                </div>
            </div>
        </div>

        <!-- FACTURAS -->
        <div class="col-md-4 mb-4">
            <div class="card text-white shadow" style="background-color:#ffc107; border-radius:12px;">
                <div class="card-body p-4">
                    <h4>🧾 Facturas</h4>
                    <p>Control de ventas</p>
                    <a href="/factura" class="btn btn-light">Ver Facturas</a>
                </div>
            </div>
        </div>

    </div>

    <!-- BOTONES -->
    <div class="text-center mt-4">
        <a href="/productos/agregar" class="btn btn-outline-primary me-2">
            ➕ Agregar Producto
        </a>

        <a href="/reporte" class="btn btn-outline-success">
            📄 Descargar Reporte PDF
        </a>
    </div>

</div>

{% endblock %}
